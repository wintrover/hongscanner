name: mobile

# Mobile suite for the Flutter Android app (mobile/).
#
# NOT a required check — this workflow never becomes a merge authority.
# The ruleset's required `ci` check + the `ALL CONTRACT SUITES PASSED`
# gate marker (tools/run_tests.sh) stay the only merge proof (AGENTS.md
# §2.1). A green run here is measured evidence the main agent reads from
# the run log before merging a mobile PR; a missing check is UNKNOWN,
# never SUCCESS.
#
# Release builds are not signed in CI: there is no keystore here, and the
# app's Gradle config refuses a release build without one (fail-closed).
# CI therefore builds the debug APK only.

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  # main-only: branch pushes are covered by `pull_request`; the paths
  # filter applies to both events.
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # google-services.json never enters the repository (mobile/README.md
      # handoff step 1: the path is gitignored). Since the google-services
      # Gradle plugin now runs on every build, CI restores the file from a
      # repo secret so the debug APK builds under the same conditions as a
      # real checkout. A missing secret is a fail-closed error, not a skip.
      - name: Restore google-services.json (never committed)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. The google-services Gradle plugin refuses to build without it (fail-closed, see mobile/README.md handoff step 2)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "restored $(wc -c < android/app/google-services.json) bytes"
        working-directory: mobile
      # JDK 21 matches the documented local toolchain (openjdk-21).
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '21'
      # The dominant mobile CI cost is the Gradle debug-APK build
      # (measured 3m18s of a 4m14s job, run 44253693670), so the Gradle
      # caches are restored keyed by the build files and the lockfile.
      - name: Gradle cache (debug APK build dominates this workflow)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      # The Flutter/Dart version is pinned to the local toolchain
      # (mobile/README.md §requirements): 3.47.9 / Dart 3.13.7.
      # cache = Flutter SDK, pub-cache = pub dependencies (flutter-action
      # v2 README); both are content-keyed by the action itself.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
          pub-cache: true
      - name: Resolve packages
        run: flutter pub get
        working-directory: mobile
      - name: Analyze
        run: flutter analyze
        working-directory: mobile
      - name: Test
        run: flutter test
        working-directory: mobile
      - name: Build debug APK (unsigned release is refused by design)
        run: flutter build apk --debug
        working-directory: mobile
      - name: Suite marker
        run: echo "MOBILE SUITE PASSED"
